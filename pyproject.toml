[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowns"
version = "0.1.0"
description = "Detect individual tree crowns as polygons from AHN point clouds and CIR aerial imagery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "laspy[lazrs]>=2.4",
    "requests>=2.28",
    "pyyaml>=6.0",
    "typer>=0.9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crowns = "crowns.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
